name: .NET CI — Build, Lint & Test

on:
  push:
    branches: [ "main", "master", "feature/**", "docs/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Verify & Run xUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Restore NuGet Dependencies
        run: dotnet restore

      - name: 4. Build Solution & Check Warnings (Linter Gate)
        run: dotnet build --no-restore --configuration Release

      - name: 5. Run Automated xUnit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal
