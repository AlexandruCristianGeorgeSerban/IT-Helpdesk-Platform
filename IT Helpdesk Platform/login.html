<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Helpdesk Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="style.css" rel="stylesheet" type="text/css" />
    
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6f9;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    
                    <div class="content-card text-center p-4">
                        
                        <div class="mb-4">
                            <h2 class="text-primary fw-bold">
                                <i class="bi bi-headset"></i> IT Helpdesk
                            </h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>

                        <form action="dashboard.html" class="text-start">
                            
                            <div class="mb-3">
                                <label for="email" class="form-label text-muted small text-uppercase fw-bold">Email Address</label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" class="form-control border-start-0" id="email" placeholder="name@company.com" required>
                                </div>
                            </div>
                            
                            <div class="mb-2">
                                <label for="password" class="form-label text-muted small text-uppercase fw-bold">Password</label>
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="••••••••" required>
                                    <span class="input-group-text bg-white border-start-0 password-toggle-icon" onclick="togglePassword('password', 'eyeIconLogin')">
                                        <i class="bi bi-eye text-muted" id="eyeIconLogin"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check mb-0 text-start">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label small text-muted" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="small text-decoration-none">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                            </button>
                            
                        </form>

                        <div class="border-top pt-3 mt-3">
                            <p class="text-muted small mb-0">
                                Don't have an account? 
                                <a href="#" class="text-decoration-none fw-bold" data-bs-toggle="modal" data-bs-target="#registerModal">Create one now</a>
                            </p>
                        </div>

                    </div>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted small">&copy; 2026 Internal IT Support. All rights reserved.</p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="registerModalLabel"><i class="bi bi-person-plus me-2"></i>Create New Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form action="dashboard.html">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">First Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Last Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Department</label>
                            <select class="form-select" required>
                                <option selected disabled value="">Choose...</option>
                                <option>HR</option>
                                <option>Finance</option>
                                <option>Sales</option>
                                <option>IT Support</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Choose Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="regPassword" required>
                                <span class="input-group-text bg-white border-start-0 password-toggle-icon" onclick="togglePassword('regPassword', 'eyeIconReg1')">
                                    <i class="bi bi-eye text-muted" id="eyeIconReg1"></i>
                                </span>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="regConfirmPassword" required>
                                <span class="input-group-text bg-white border-start-0 password-toggle-icon" onclick="togglePassword('regConfirmPassword', 'eyeIconReg2')">
                                    <i class="bi bi-eye text-muted" id="eyeIconReg2"></i>
                                </span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register & Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
