<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-headset"></i> IT Helpdesk
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="ticket-list.html">Tickets</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link active-page" href="create-ticket.html">New Ticket</a></li>
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="knowledge-base.html">Knowledge Base</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link custom-nav-link" href="profile.html"><i class="bi bi-person-circle"></i> My Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>

<div class="container main-container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="content-card">
                    <h3 class="mb-4"><i class="bi bi-ticket-detailed me-2"></i>Submit a New Ticket</h3>
                    <form id="newTicketForm">
                        <div class="mb-3">
                            <label for="ticketTitle" class="form-label fw-bold">Issue Title</label>
                            <input type="text" class="form-control" id="ticketTitle" placeholder="E.g., Cannot connect to the 2nd floor printer" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label fw-bold">Category</label>
                                <select class="form-select" id="category" required>
                                    <option selected disabled value="">Select category...</option>
                                    <option value="1">Hardware</option>
                                    <option value="2">Software</option>
                                    <option value="3">Network / Internet</option>
                                    <option value="4">Accounts / Access</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="priority" class="form-label fw-bold">Priority Level</label>
                                <select class="form-select" id="priority" required>
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold">Detailed Description</label>
                            <textarea class="form-control" id="description" rows="5" placeholder="Please provide as many details as possible..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="screenshot" class="form-label fw-bold">Screenshots / Attachments (Optional)</label>
                            <input class="form-control" type="file" id="screenshot" accept="image/*" multiple>
                            <div class="form-text">You can upload multiple images (JPG, PNG).</div>
                        </div>

                        <div class="d-flex justify-content-end border-top pt-3">
                            <button type="reset" class="btn btn-light me-2">Cancel</button>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i> Submit Ticket</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i> Ticket submitted successfully! Redirecting...
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
